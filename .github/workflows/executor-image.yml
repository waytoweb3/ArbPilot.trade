name: executor-image

# 执行器镜像在 GitHub 的 amd64 runner 上构建，推送到 GHCR；
# 服务器只 pull 镜像，不再需要同步源码，也不会出现源码与线上不一致。
on:
  push:
    branches: [main]
    paths:
      - "apps/executor/**"
      - "crates/arb-core/**"
      - "apps/desktop/src-tauri/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deploy/services/executor.Dockerfile"
      - ".github/workflows/executor-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/waytoweb3/arbpilot-executor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/services/executor.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Rust 依赖编译很慢，跨工作流复用 gha 缓存可把增量构建压到几分钟。
          cache-from: type=gha
          cache-to: type=gha,mode=max

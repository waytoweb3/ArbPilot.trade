name: desktop-windows

# Tauri 不支持从 macOS 交叉编译 Windows 安装包（缺 MSVC 与 NSIS 工具链），
# 因此 Windows 客户端统一在 GitHub 的 windows-latest runner 上打包。
# 产物：NSIS 安装包、更新签名与 latest.json，下载后上传到 download.arbpilot.trade/desktop/。
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 更新说明（写入 latest.json，客户端更新卡片会显示）
        required: false
        default: ""
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # 仓库里的 .sh 都是 LF，Windows runner 默认的换行转换会让 bash 执行失败。
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Cargo workspace 的 target 目录在仓库根目录。
          workspaces: "."

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 桌面端启动时拉起执行器 sidecar，安装包必须把它一起打进去。
      - name: 构建执行器 sidecar
        shell: bash
        run: bash deploy/prepare-sidecar.sh release

      - name: 检查更新签名密钥
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          [ -n "$KEY" ] || {
            echo "缺少仓库 Secret：TAURI_SIGNING_PRIVATE_KEY" >&2
            exit 1
          }

      # 只打 NSIS：Tauri 的 Windows 增量更新只认 NSIS 安装包，MSI 无法用于自动升级。
      - name: 打包 Windows 安装包
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis

      # Windows 默认 shell 是 pwsh，find 会解析到 Windows 自带的 find.exe；
      # 这里显式用 bash，才能拿到真实产物清单。
      - name: 列出打包产物
        shell: bash
        run: find target/release/bundle -maxdepth 2 -type f | sort

      - name: 生成 latest.json
        shell: bash
        env:
          ARBPILOT_DESKTOP_NOTES: ${{ inputs.notes }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          (async () => {
            const crypto = require("crypto");
            const version = JSON.parse(
              fs.readFileSync("apps/desktop/src-tauri/tauri.conf.json", "utf8"),
            ).version;
            const outDir = "dist/desktop";
            const bundleDir = "target/release/bundle/nsis";

            // 先打印实际产物，命名与 Tauri 版本有关，出问题时日志里能直接看到。
            const files = fs.readdirSync(bundleDir);
            console.log(`NSIS 产物：${files.join(", ")}`);

            const installer = files.find((name) => /-setup\.exe$/i.test(name));
            if (!installer) {
              throw new Error(`未找到 NSIS 安装包：${bundleDir}`);
            }
            // 官网下载用 setup.exe；自动更新优先用带签名的 .nsis.zip 更新包，
            // 个别版本只产出 setup.exe 时退化为安装包本身。
            const hasSig = (name) => files.includes(`${name}.sig`);
            const zip = files.find((name) => /-setup\.(nsis|exe)\.zip$/i.test(name) && hasSig(name));
            const updater = zip || (hasSig(installer) ? installer : null);
            if (!updater) {
              throw new Error(`未找到带签名的更新包：${bundleDir}`);
            }
            const sigPath = path.join(bundleDir, `${updater}.sig`);
            const signature = fs.readFileSync(sigPath, "utf8").trim();

            fs.mkdirSync(outDir, { recursive: true });
            fs.copyFileSync(path.join(bundleDir, installer), path.join(outDir, installer));
            // 退化为安装包本身时，源和目标相同，不能再复制一次。
            if (updater !== installer) {
              fs.copyFileSync(path.join(bundleDir, updater), path.join(outDir, updater));
              fs.copyFileSync(sigPath, path.join(outDir, `${updater}.sig`));
            } else {
              fs.copyFileSync(sigPath, path.join(outDir, `${installer}.sig`));
            }

            // 未购买 Windows 代码签名证书，官网靠 SHA-256 让用户自行核对安装包。
            const sha256 = crypto
              .createHash("sha256")
              .update(fs.readFileSync(path.join(bundleDir, installer)))
              .digest("hex");
            fs.writeFileSync(
              path.join(outDir, "SHA256SUMS-windows.txt"),
              `${sha256}  ${installer}\n`,
            );

            const baseUrl = "https://download.arbpilot.trade/desktop";
            let platforms = {};
            // 读不到线上清单时不让打包失败：其它平台的条目由发布流程在服务器上合并。
            try {
              const response = await fetch(`${baseUrl}/latest.json`, { cache: "no-store" });
              if (response.ok) {
                const published = await response.json();
                // 只有同一个版本才合并，避免把旧包地址带到新版本里。
                if (published.version === version && published.platforms) {
                  platforms = published.platforms;
                } else {
                  console.log(
                    `线上清单版本 ${published.version} 与当前 ${version} 不一致，只发布本平台条目`,
                  );
                }
              } else {
                console.log(`线上清单返回 HTTP ${response.status}，跳过合并`);
              }
            } catch (error) {
              console.log(`读取线上清单失败：${error.message}，跳过合并`);
            }
            platforms["windows-x86_64"] = {
              signature,
              url: `${baseUrl}/${updater}`,
            };

            const manifest = {
              version,
              notes: process.env.ARBPILOT_DESKTOP_NOTES || "",
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              platforms,
            };
            fs.writeFileSync(
              path.join(outDir, "latest.json"),
              `${JSON.stringify(manifest, null, 2)}\n`,
            );
          })();
          NODE

      - name: 校验 latest.json
        run: node scripts/verify-update.js dist/desktop/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: arbpilot-desktop-windows
          path: dist/desktop/
          if-no-files-found: error

      # 打标签时同步发布到 GitHub Release，作为下载站不可达时的备用渠道。
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "ArbPilot $tag" \
              --notes "安装包见下方 Assets；自动更新清单：https://download.arbpilot.trade/desktop/latest.json"
          fi
          gh release upload "$tag" dist/desktop/* --clobber

name: arbpilot-svc

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先设置 POSTGRES_PASSWORD}
      POSTGRES_DB: arbpilot
    volumes:
      - arbpilot-pgdata:/var/lib/postgresql/data
    # 数据库只绑定回环地址，不对外暴露。
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbpilot -d arbpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 账号服务：镜像由 GitHub Actions 构建并推送到 GHCR（.github/workflows/accounts-image.yml），
  # 服务器只 pull，不再需要同步源码；可用 ARBPILOT_ACCOUNTS_IMAGE 固定到某个 sha-<commit>。
  accounts:
    image: ${ARBPILOT_ACCOUNTS_IMAGE:-ghcr.io/waytoweb3/arbpilot-accounts:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./accounts.env
    # Ed25519 权益签名密钥只读挂载，重启后已签发的权益令牌仍然有效。
    volumes:
      - ./keys:/run/secrets:ro
    networks:
      - internal
      - edge

  # 支付服务：镜像由 GitHub Actions 构建并推送到 GHCR（.github/workflows/payments-image.yml），
  # 服务器只 pull，不再需要同步源码；可用 ARBPILOT_PAYMENTS_IMAGE 固定到某个 sha-<commit>。
  payments:
    image: ${ARBPILOT_PAYMENTS_IMAGE:-ghcr.io/waytoweb3/arbpilot-payments:latest}
    restart: unless-stopped
    env_file:
      - ./payments.env
    volumes:
      # 许可证、商品缓存与策略订单都落在这里，必须持久化。
      - arbpilot-paydata:/app/.data
      - ./keys:/run/secrets:ro
    networks:
      - internal
      - edge

  # 执行器：行情采集、资金费率、新闻与策略托管。桌面端远程连接这台实例。
  executor:
    # 镜像由 GitHub Actions 构建并推送到 GHCR（.github/workflows/executor-image.yml），
    # 服务器只 pull，不再需要同步源码；可用 ARBPILOT_EXECUTOR_IMAGE 固定到某个 sha-<commit>。
    image: ${ARBPILOT_EXECUTOR_IMAGE:-ghcr.io/waytoweb3/arbpilot-executor:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./executor.env
    volumes:
      # 账户凭证、风控限额与授权令牌都在这里，必须持久化且不对外暴露。
      - arbpilot-execdata:/data
    # 默认只绑定回环地址，桌面端通过 SSH 隧道或反代连接；
    # 需要让桌面端直接用服务器 IP 访问时，在 .env 里设置 ARBPILOT_EXECUTOR_HOST=0.0.0.0 并放行端口。
    ports:
      - "${ARBPILOT_EXECUTOR_HOST:-127.0.0.1}:${ARBPILOT_EXECUTOR_PORT:-8787}:8787"
    networks:
      - internal
      - edge

volumes:
  arbpilot-pgdata:
  arbpilot-paydata:
  arbpilot-execdata:

networks:
  internal:
  # 与 deploy/site/docker-compose.yml 里的 nginx 共用，便于反代 pay/auth。
  edge:
    external: true
    name: arbpilot-edge

# 由 deploy/site/docker-compose.yml 挂载到容器内，作为默认站点配置。
# 证书由宿主机 certbot 通过 webroot 方式签发，目录挂载见 docker-compose.yml。

server {
    listen 80;
    listen [::]:80;
    server_name arbpilot.trade www.arbpilot.trade;

    server_tokens off;

    # certbot 续期校验路径，必须留在 HTTP 且不跳转。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # 容器健康检查。
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arbpilot.trade www.arbpilot.trade;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/arbpilot.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arbpilot.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # 带哈希的构建产物可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA 路由：/pricing、/privacy、/terms、/device、/checkout/success。
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# ---------------------------------------------------------------------------
# 支付服务：pay.arbpilot.trade -> payments 容器（Pancake 收银台、webhook、许可证）
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pay.arbpilot.trade;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pay.arbpilot.trade;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/pay.arbpilot.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.arbpilot.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # webhook 需要原始报文验签，不能改写请求体。
    client_max_body_size 2m;

    location / {
        proxy_pass http://payments:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
}

# ---------------------------------------------------------------------------
# 执行器：exec.arbpilot.trade -> executor 容器（行情、资金费率、新闻与策略）
# 桌面端远程连接这台实例；授权仍由各自的 Bearer 令牌校验。
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name exec.arbpilot.trade;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exec.arbpilot.trade;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/exec.arbpilot.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exec.arbpilot.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 策略代码与沙箱模块上传。
    client_max_body_size 8m;

    location / {
        proxy_pass http://executor:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # 事件推送走 WebSocket，需要升级连接并保持长连接。
    location /api/v1/events {
        proxy_pass http://executor:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
}

# ---------------------------------------------------------------------------
# 安装包下载：download.arbpilot.trade -> 容器内 /usr/share/nginx/download
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name download.arbpilot.trade;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name download.arbpilot.trade;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/download.arbpilot.trade/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/download.arbpilot.trade/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/download;
    # 安装包体积大，按目录列出便于核对版本与大小。
    autoindex on;
    autoindex_exact_size off;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
}


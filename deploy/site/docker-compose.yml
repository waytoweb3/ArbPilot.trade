name: arbpilot-site

services:
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 直接发布 apps/site/dist 的构建产物。
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # 安装包目录，download.arbpilot.trade 直接对外提供文件下载。
      - ./download:/usr/share/nginx/download:ro
      # certbot webroot 与签发好的证书（宿主机签发，容器只读）。
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - default
      # 与 deploy/services/docker-compose.yml 共用，用于反代 pay/auth。
      - edge

networks:
  edge:
    external: true
    name: arbpilot-edge

name: arbpilot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arbpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arbpilot}
      POSTGRES_DB: arbpilot
    volumes:
      - arbpilot-pgdata:/var/lib/postgresql/data
    # 默认只绑定本机；远程访问请通过 SSH 隧道/VPN，不要直接暴露数据库。
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbpilot -d arbpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.executor
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARBPILOT_BIND_ADDR: 0.0.0.0:8787
      ARBPILOT_API_TOKEN: ${ARBPILOT_API_TOKEN:?请先设置 ARBPILOT_API_TOKEN}
      DATABASE_URL: postgres://arbpilot:${POSTGRES_PASSWORD:-arbpilot}@postgres:5432/arbpilot
      ARBPILOT_FUNDING_ENABLED: ${ARBPILOT_FUNDING_ENABLED:-true}
      ARBPILOT_FUNDING_SYMBOLS: ${ARBPILOT_FUNDING_SYMBOLS:-BTCUSDT,ETHUSDT}
      ARBPILOT_FUNDING_POLL_SECS: ${ARBPILOT_FUNDING_POLL_SECS:-60}
      ARBPILOT_BINANCE_FAPI_URL: ${ARBPILOT_BINANCE_FAPI_URL:-https://fapi.binance.com}
      # 账号授权校验：默认关闭；官方托管镜像可通过构建环境打开
      ARBPILOT_LICENSE_REQUIRED: ${ARBPILOT_LICENSE_REQUIRED:-false}
      ARBPILOT_LICENSE_PUBLIC_KEY: ${ARBPILOT_LICENSE_PUBLIC_KEY:-}
      ARBPILOT_LICENSE_GRACE_HOURS: ${ARBPILOT_LICENSE_GRACE_HOURS:-72}
      # true = 官方托管执行器，只运行已发布到市场的策略；自托管保持 false。
      ARBPILOT_HOSTED: ${ARBPILOT_HOSTED:-false}
      RUST_LOG: info,arbpilot_executor=debug
    # 账户凭证、风控限额与 Telegram 绑定都在 data/ 下，必须持久化。
    volumes:
      - arbpilot-data:/home/arbpilot/data
    # 管理端口仅绑定回环地址，桌面端通过 SSH 隧道连接。
    ports:
      - "127.0.0.1:${ARBPILOT_EXECUTOR_PORT:-8787}:8787"

volumes:
  arbpilot-pgdata:
  arbpilot-data:

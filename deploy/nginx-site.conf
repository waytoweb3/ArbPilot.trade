# 由 deploy/deploy-site.sh 生成，重新部署会覆盖，请勿直接修改。
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __WEB_ROOT__;
    index index.html;

    # 带哈希的构建产物可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA 路由：/pricing、/privacy、/terms、/device、/checkout/success。
    # 其余静态文件保持 no-cache，保证发版后立即生效。
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

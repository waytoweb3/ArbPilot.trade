[package]
name = "arbpilot-executor"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ArbPilot 自托管执行器：行情、风控与订单执行"

[dependencies]
anyhow = { workspace = true }
arb-core = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
k256 = { workspace = true }
lighters = { workspace = true }
ring = { workspace = true }
rust_decimal = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wasmtime = { version = "50.0.1", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wat = "1"
webpki-roots = { workspace = true }

# 桌面端用系统钥匙串保存主密钥；Linux（自托管服务器/容器）走本地密钥文件，避免依赖 D-Bus。
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
rust_decimal_macros = { workspace = true }
